name: Wiki

on:
  push:
    branches: [main]
    paths: ['wiki/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Publish wiki/ to the wiki
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -e

          git clone --quiet \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" \
            published

          rm -f published/*.md
          cp wiki/*.md published/
          rm -f published/README-first.md

          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --quiet --cached; then
            echo "the wiki already matches wiki/"
            exit 0
          fi

          git commit -m "${MESSAGE:-Wiki}"
          git push
