; UNI2 Improvement Mod
; Every key here is explained in the README, under "The ini file".

[Mod]
DinputDllWrapper =
CheckForUpdates = 1

[Keybinds]
ToggleOverlay = F1
ToggleHitboxOverlay = F2
ToggleFrameMeter = F3
FreezeFrame = F5
StepForward = F6
NextPalette = F8
PreviousPalette = F7
FunctionKey =

[PadKeybinds]
