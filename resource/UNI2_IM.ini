; UNI2 Improvement Mod
; Every key here is explained in the README, under "The ini file".

[Mod]
DinputDllWrapper =

[Keybinds]
ToggleOverlay = F1
ToggleHitboxOverlay = F2
ToggleFrameMeter = F3
FreezeFrame = F5
StepForward = F6

[Training]
FreezeMode = 0
AutoPauseOnAttack = 0
AutoPauseComboStops = 3
AutoPauseBlockStops = 3
ResumeDelayFrames = 60
StepRepeatDelayMs = 250
StepRepeatIntervalMs = 90
RecordFrameCounterRva = 0

[FrameMeter]
PlaceAutomatically = 0
PositionX = -1
PositionY = -1
Scale = 1.5
BandCounts = 1
LineTotals = 1
AttributeRow = 1
Opacity = 100
MouseDrag = 1

[Palette]
CompanionCharacters = 15
ShowOnlinePalettes = 1
OwnersFromDraws = 1
IdentifyByColours = 0
PaintOutOfMatch = 0
PaintEffectRows = 1
ShowLegacyTab = 0
GroupByPart = 1
FlashEntry = 1
FilterJunk = 1

[Video]
FlatStage = 0
FlatStageColour = 65280
TimerResolution = 1
PowerThrottlingOptOut = 1
DisplayTuning = 1
FullscreenRefreshHz = 0
ExtraBackBuffer = 0
PumpWait = 0
PumpWaitAllInput = 0

[Overlay]
BlockGameMouse = 0
UiScale = 1.0
Notifications = 1

[Debug]
MemoryDebug = 0
Profiler = 0
MeterTrace = 0
